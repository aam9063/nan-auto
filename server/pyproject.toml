[project]
name = "nan-auto-server"
version = "0.1.0"
description = "NaN Auto: OpenAI-compatible model router powered by Clef"
authors = [
    { name = "albert", email = "albert9063@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "aiosqlite>=0.22.1",
    "fastapi>=0.162.7",
    "httpx>=0.28.1",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.3",
    "python-multipart>=0.0.33",
    "pyyaml>=6.0.3",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
nan-auto = "nan_auto.main:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "nan_auto"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
include = ["src", "tests"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.14"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "respx>=0.23.1",
    "ruff>=0.17.5",
]
