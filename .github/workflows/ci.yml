name: ci
on:
  pull_request:
    branches: [dev, main]
permissions:
  contents: read
jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        # pyproject.toml lives in server/, not at the repo root.
        working-directory: server
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      - run: uv run pytest
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # The action reads "packageManager" from the ROOT package.json, which does
      # not exist in this monorepo; the version lives in web/package.json.
      - uses: pnpm/action-setup@v4
        with:
          version: 11.4.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm --dir web install --frozen-lockfile
      - run: pnpm --dir web lint
      - run: pnpm --dir web typecheck
      - run: pnpm --dir web build
